<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analog Clock</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background: transparent;
    overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* همیشه مربع — کوچیکتر از iframe برای جا دادن سایه */
  .clock-card {
    width: 88vmin;
    height: 88vmin;
    background: #ffffff;
    border-radius: 14%;
    box-shadow:
      0 3vmin 8vmin rgba(0, 0, 0, 0.08),
      0 0.8vmin 2vmin rgba(0, 0, 0, 0.04),
      inset 0 0 0 1px rgba(0, 0, 0, 0.03);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-sizing: border-box;
  }

  .clock {
    width: 68vmin;
    height: 68vmin;
    position: relative;
  }

  .tick {
    position: absolute;
    left: 50%;
    top: 2.4vmin;
    width: 0.75vmin;
    height: 2.4vmin;
    background: #d8d8d8;
    border-radius: 0.4vmin;
    transform-origin: 50% 31.6vmin;
    transform: translateX(-50%);
  }

  .hand {
    position: absolute;
    left: 50%;
    bottom: 50%;
    transform-origin: 50% 100%;
    border-radius: 1.3vmin;
    transition: transform 0.05s cubic-bezier(0.4, 2.3, 0.6, 1);
  }

  .hour {
    width: 2.2vmin;
    height: 18vmin;
    background: #111;
    margin-left: -1.1vmin;
  }

  .minute {
    width: 1.7vmin;
    height: 26vmin;
    background: #111;
    margin-left: -0.85vmin;
  }

  .second {
    width: 0.75vmin;
    height: 29vmin;
    background: #d97a3c;
    margin-left: -0.37vmin;
    transition: transform 0.1s cubic-bezier(0.4, 2.3, 0.6, 1);
  }

  .center {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 4vmin;
    height: 4vmin;
    background: #c98a3a;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 0.6vmin #fff, 0 0.3vmin 0.8vmin rgba(0, 0, 0, 0.2);
    z-index: 5;
  }
</style>
</head>
<body>
  <div class="clock-card">
    <div class="clock" id="clock">
      <div class="hand hour" id="hour"></div>
      <div class="hand minute" id="minute"></div>
      <div class="hand second" id="second"></div>
      <div class="center"></div>
    </div>
  </div>

<script>
  const clock = document.getElementById('clock');
  for (let i = 0; i < 12; i++) {
    const tick = document.createElement('div');
    tick.className = 'tick';
    tick.style.transform = `translateX(-50%) rotate(${i * 30}deg)`;
    clock.appendChild(tick);
  }

  const hourHand = document.getElementById('hour');
  const minuteHand = document.getElementById('minute');
  const secondHand = document.getElementById('second');

  function updateClock() {
    const now = new Date();
    const h = now.getHours() % 12;
    const m = now.getMinutes();
    const s = now.getSeconds();
    const ms = now.getMilliseconds();

    const secondDeg = (s + ms / 1000) * 6;
    const minuteDeg = (m + s / 60) * 6;
    const hourDeg = (h + m / 60) * 30;

    hourHand.style.transform = `rotate(${hourDeg}deg)`;
    minuteHand.style.transform = `rotate(${minuteDeg}deg)`;
    secondHand.style.transform = `rotate(${secondDeg}deg)`;
  }

  updateClock();
  setInterval(updateClock, 1000);
</script>
</body>
</html>
