<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analog Clock</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, sans-serif;
  }

  .clock-card {
    width: 220px;
    height: 220px;
    background: #ffffff;
    border-radius: 32px;
    box-shadow:
      0 10px 30px rgba(0, 0, 0, 0.08),
      0 2px 6px rgba(0, 0, 0, 0.04),
      inset 0 0 0 1px rgba(0, 0, 0, 0.03);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .clock {
    width: 170px;
    height: 170px;
    position: relative;
  }

  /* tiny tick marks */
  .tick {
    position: absolute;
    left: 50%;
    top: 6px;
    width: 2px;
    height: 6px;
    background: #d8d8d8;
    border-radius: 1px;
    transform-origin: 50% 79px;
    transform: translateX(-50%);
  }

  .hand {
    position: absolute;
    left: 50%;
    bottom: 50%;
    transform-origin: 50% 100%;
    border-radius: 4px;
    transition: transform 0.05s cubic-bezier(0.4, 2.3, 0.6, 1);
  }

  .hour {
    width: 6px;
    height: 46px;
    background: #111;
    margin-left: -3px;
  }

  .minute {
    width: 5px;
    height: 64px;
    background: #111;
    margin-left: -2.5px;
  }

  .second {
    width: 2px;
    height: 72px;
    background: #d97a3c;
    margin-left: -1px;
    transition: transform 0.1s cubic-bezier(0.4, 2.3, 0.6, 1);
  }

  .center {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 10px;
    height: 10px;
    background: #c98a3a;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 1.5px #fff, 0 1px 2px rgba(0, 0, 0, 0.2);
    z-index: 5;
  }
</style>
</head>
<body>
  <div class="clock-card">
    <div class="clock" id="clock">
      <div class="hand hour" id="hour"></div>
      <div class="hand minute" id="minute"></div>
      <div class="hand second" id="second"></div>
      <div class="center"></div>
    </div>
  </div>

<script>
  // create 12 tick marks
  const clock = document.getElementById('clock');
  for (let i = 0; i < 12; i++) {
    const tick = document.createElement('div');
    tick.className = 'tick';
    tick.style.transform = `translateX(-50%) rotate(${i * 30}deg)`;
    clock.appendChild(tick);
  }

  const hourHand = document.getElementById('hour');
  const minuteHand = document.getElementById('minute');
  const secondHand = document.getElementById('second');

  function updateClock() {
    const now = new Date();
    const h = now.getHours() % 12;
    const m = now.getMinutes();
    const s = now.getSeconds();
    const ms = now.getMilliseconds();

    const secondDeg = (s + ms / 1000) * 6;
    const minuteDeg = (m + s / 60) * 6;
    const hourDeg = (h + m / 60) * 30;

    hourHand.style.transform = `rotate(${hourDeg}deg)`;
    minuteHand.style.transform = `rotate(${minuteDeg}deg)`;
    secondHand.style.transform = `rotate(${secondDeg}deg)`;
  }

  updateClock();
  setInterval(updateClock, 1000);
</script>
</body>
</html>
